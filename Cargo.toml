[package]
name = "ots-client"
version = "0.1.0"
edition = "2024"
description = "Modern, dependency-light Rust client for OpenTimestamps"
license = "LGPL-3.0-or-later"

[[bin]]
name = "ots"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
futures = "0.3"
rayon = "1"

sha1 = "0.10"
sha2 = "0.10"
ripemd = "0.1"
tiny-keccak = { version = "2", features = ["keccak"] }
rand = "0.8"

hex = "0.4"
anyhow = "1"
thiserror = "2"
dirs = "5"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glob = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
